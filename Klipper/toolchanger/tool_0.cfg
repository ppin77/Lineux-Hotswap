# TOOL 0 CONFIGURATION
# Hardware:
#  V6 CHP
#  3010 hotend fan

####################
# Tool0 Variables
[gcode_macro _VARIABLES_T0]
# Absolute pickup moves in XYZ coordinates + speed (MUST HAVE 4 fields!!)
# Accept any number of moves
# Macros accepted other than coordinates
# If using same axis position as previous move, use -128

variable_pickup_approachlocation: [26.77,-128,-128,500]
variable_pickup_moves: ["DOCKSLIDE_DEPLOY",
						"-128,4.00,-128,300",
						"23.77,-128,-128,200",
						"-128,-9.00,-128,300",
						"26.77,-128,-128,200",
						"TOOL_RETRACT",
						"FIXED_DOCK_SAFE_Y SPEED=300",
						"DOCKSLIDE_PARK"]

variable_dropoff_approachlocation: [26.77,-128,-128,500]
variable_dropoff_moves: ["DOCKSLIDE_DEPLOY",
						 "-128,-9.00,-128,300",
						 "23.77,-128,-128,200",
						 "-128,4.00,-128,300",
						 "26.77,-128,-128,200",
						 "FIXED_DOCK_SAFE_Y SPEED=300",
						 "DOCKSLIDE_PARK"]

variable_xoffset: 0              # For tool 0, offsets are all 0
variable_yoffset: 0              # 
variable_zoffset: 0              # 
variable_shaperfreq_x: 149.8      # Tool 0 input shaper
variable_shaperfreq_y: 145.2      # 
variable_shapertype_x: "ei"     # 
variable_shapertype_y: "ei"      # 

# End of section options
#######################################################

variable_pressure_advance: 0.0
gcode:

# Tool 0 hotend. The physical extruder motor is defined separately below
# because it is shared by every hotend.
[extruder]
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 8700
max_extrude_cross_section: 500
heater_pin: PA0
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC5
#pullup_resistor: 2200
min_temp: 10
max_temp: 300
min_extrude_temp: 170
control: pid
pid_Kp: 35.757
pid_Ki: 15.892
pid_Kd: 20.113
smooth_time: 1.5
pwm_cycle_time: 0.100

[heater_fan hotend_fan0]
pin: PA4
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

#####################################################################
# TOOL 0 EXECUTION MACRO (Klipper accepts both T0 and t0 commands)	#
#####################################################################

[gcode_macro T0]
variable_spool_id: None
variable_active: False
gcode:
  TOOL_PICKUP TOOLNUMBER=0
  ACTIVATE_EXTRUDER EXTRUDER=extruder

  {% if spool_id is not none %}
    SET_ACTIVE_SPOOL ID={spool_id}
  {% else %}
    CLEAR_ACTIVE_SPOOL
  {% endif %}