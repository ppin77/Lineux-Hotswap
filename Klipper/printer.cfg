# =====================================================================
# BIGTREETECH MANTA M8P V1.1 - PRINTER.CFG (AWD + QUAD-Z + TOOLBOARD READY)
# =====================================================================
# MCU: STM32G0B1 with "8KiB bootloader"
# Setup: Voron 350mm AWD CoreXY + Quad-Z (extruder runs via EBB36)
# Drivers: TMC5160 Pro (Sense Resistor: 0.075 Ohm) @ 48V HV
# =====================================================================

[include fluidd.cfg]
#[include ebb36v121.cfg]
#[include anthead1.cfg]
[include cartographer.cfg]
[include bedfans.cfg]
[include toolchanger/btc.cfg]

[mcu rpi]
serial: /tmp/klipper_host_mcu

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3300270011504B4633373520-if00
canbus_uuid: b8a802ff2b49

[mcu octopus]
#serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3300270011504B4633373520-if00
canbus_uuid: 6bf985f867a4

[printer]
kinematics: corexy
max_velocity: 650  
max_accel: 8900    			
max_z_velocity: 150 			
max_z_accel: 3000
square_corner_velocity: 5.0

[force_move]
enable_force_move: True

[exclude_object]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT



#############################################################################################################################
################################Plugins#####################################################################################
[auto_speed]
axis: y, x         # Adds the Z axis to the automatic test run
margin: 40
settling_home: 1
max_missed: 25.0 
#[sensorless_homing_helper]
#tmc_stepper_y_name: tmc5160 stepper_y       # The TMC stepper section name for Y
#tmc_stepper_x_name: tmc5160 stepper_x       # The TMC stepper section name for X
#home_current: 1.1                           # The current while running the sensorless homing

#minimum_homing_distance: 20                 # (Optional) The minimum distance to achieve the r#epeatible sensorless homing
#retract_distance: 10                        # (Optional) The retract distance after the axis is homed
#retract_speed: 70                           # (Optional) The speed while running the retraction (both before and after homing)
#stallguard_reset_time: 1                    # (Optional) The time for stallguard to reset before the next homing move

[motors_sync]
axes: x, y
accel_chip: adxl345

#[shaketune]
# result_folder: ~/printer_data/config/ShakeTune_results
# number_of_results_to_keep: 5
# keep_raw_data: False

##################################################################################################################################


[temperature_sensor M8P]
sensor_type: temperature_mcu

[temperature_sensor Octopus]
sensor_type: temperature_mcu
sensor_mcu: octopus
[temperature_sensor Host_CM4]
sensor_type: temperature_host

# =====================================================================
#  X/Y MOTION AXES (AWD COREXY SETUP)
# =====================================================================

## --- MOTOR 1: B motor (main motor X - rear left) ---
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 64 #16
rotation_distance: 40
full_steps_per_rotation: 200
#endstop_pin: ^PB14
endstop_pin: tmc5160_stepper_x:virtual_endstop
homing_retract_dist: 0                 # Must be 0 for sensorless homing!
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 100 #80 #70 #40 #20   
homing_positive_dir: true


[tmc5160 stepper_x]
cs_pin: PC13
#spi_bus: spi1
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 1.500 #1.600 #0.800
sense_resistor: 0.075
stealthchop_threshold: 0
diag1_pin: ^!PF4                        # DIAG pin for motor 1 (corresponds to PF4)
driver_SGT: 2 #-10 #1                          # Initial sensitivity value (needs tuning, range -64 to +63)



## --- MOTOR 7: B1 motor (additional motor X - front left) ---
[stepper_x1]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 64 #16
rotation_distance: 40

[tmc5160 stepper_x1]
cs_pin: PD5
#spi_bus: spi1
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 1.500 #1.600 #0.800
sense_resistor: 0.075
stealthchop_threshold: 0


## --- MOTOR 2: A motor (main motor Y - rear right) ---
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 64 #16
rotation_distance: 40
full_steps_per_rotation: 200
#endstop_pin: ^PB13
endstop_pin: tmc5160_stepper_y:virtual_endstop
homing_retract_dist: 0                 # Must be 0
position_min: -9 #0
position_endstop: 350
position_max: 350
homing_speed: 100 #80 #70 #40 #20  
homing_positive_dir: true

[tmc5160 stepper_y]
cs_pin: PE3
#spi_bus: spi1
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 1.500 #1.600 #800
sense_resistor: 0.075
stealthchop_threshold: 0
diag1_pin: ^!PF3                        # DIAG pin for motor 2 (corresponds to PF3)
driver_SGT: 2 #1 #2 #1 #-10 #0 #-10 #1                          # Initial sensitivity value



## --- MOTOR 8: A1 motor (additional motor Y - front right) ---
[stepper_y1]
step_pin: PC7
dir_pin: !PC8
enable_pin: !PD2
microsteps: 64 #16
rotation_distance: 40

[tmc5160 stepper_y1]
cs_pin: PC6
#spi_bus: spi1
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 1.500 #1.600
sense_resistor: 0.075
stealthchop_threshold: 0

# =====================================================================
#  Z AXES (QUAD Z LAYOUT Z0 -> Z1 -> Z2 -> Z3)
# =====================================================================

## --- MOTOR 3: Z0 motor (front left) ---
[stepper_z]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
#endstop_pin: ^EBBT0: PB6               # Physical Z endstop (if used)
position_min: -5
#position_endstop: 0
position_max: 332 #340
homing_speed: 5 #10 #25 #15
second_homing_speed: 3
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0 #0 carto


[tmc5160 stepper_z]
cs_pin: PB9
#spi_bus: spi1
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 0.9 #1.00 #1.200 #0.800
sense_resistor: 0.075
stealthchop_threshold: 0

## --- MOTOR 4: Z1 motor (rear left) ---
[stepper_z1]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc5160 stepper_z1]
cs_pin: PB5
#spi_bus: spi1
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 0.9 #1.00 #1.200 #0.800
sense_resistor: 0.075
stealthchop_threshold: 0

## --- MOTOR 5: Z2 motor (rear right) ---
[stepper_z2]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc5160 stepper_z2]
cs_pin: PG14
#spi_bus: spi1
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 0.9 #1.00 #1.200 #0.800
sense_resistor: 0.075
stealthchop_threshold: 0

## --- MOTOR 6: Z3 motor (front right) ---
[stepper_z3]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc5160 stepper_z3]
cs_pin: PG10
#spi_bus: spi1
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: True
run_current: 0.9 #1.00 #1.200 #0.800
sense_resistor: 0.075
stealthchop_threshold: 0

