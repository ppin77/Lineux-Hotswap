[gcode_macro FILAMENT_UNLOAD]
description: Shapes the filament tip and unloads it safely from the Papilio Lite
gcode:
    {% set TARGET_TEMP = params.TARGET_TEMP|default(230)|float %}
    
    # Enable the sensor lock
    SET_GCODE_VARIABLE MACRO=_USER_VARIABLES VARIABLE=unloading VALUE=1
    
    SAVE_GCODE_STATE NAME=unload_state
    G91                             
    
    {% if printer.extruder.temperature < 190 %}
        M117 Heating to {TARGET_TEMP}C...
        M109 S{TARGET_TEMP}
    {% endif %}
    
    M117 Shaping filament tip...
    M83                             
    
    G1 E5 F300                      
    G1 E-15 F3000                   
    G4 P2000                        
    
    M117 Unloading filament...
    G1 E-60 F1200                   ; Works now, thanks to max_extrude_only_distance
    M400                            
    
    M117 Filament unloaded!
    RESTORE_GCODE_STATE NAME=unload_state
    
    # Wait 2 seconds so you have time to pull the filament out completely
    G4 P2000
    # Release the sensor lock again
    SET_GCODE_VARIABLE MACRO=_USER_VARIABLES VARIABLE=unloading VALUE=0



