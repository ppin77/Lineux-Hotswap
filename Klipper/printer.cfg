# =====================================================================
#  HOMING & GANTRY LEVELING GEOMETRY
# =====================================================================

#[safe_z_home]
#home_xy_position: 170,170
#speed: 100
#z_hop: 10


[homing_override]
axes: xyz
gcode:
  {% set HOME_CUR_OPERATIONAL = 1.500 %} # Full current for printing
  {% set HOME_CUR_HOMING = 1.100 %}      # Reduced homing current for all 4 AWD motors
  
  SAVE_GCODE_STATE NAME=STATE_HOMING

  # Check which axes were requested
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set home_x = 'X' in params %}
  {% set home_y = 'Y' in params %}
  {% set home_z = 'Z' in params %}

  # =====================================================================
  # PRE Z-HOP WITH FORCE MOVE (protects the nozzle)
  # =====================================================================
  {% if home_all or home_x or home_y %}
    {action_respond_info("Erzwinge Z-Hop per Force Move vor dem X/Y Homing...")}
    SET_KINEMATIC_POSITION Z=0
    G91
    G1 Z5 F600                          # Lift 5 mm
    G90
    M400
  {% endif %}

  # =====================================================================
  # LOWER THE CURRENT OF ALL X/Y MOTORS (AWD)
  # =====================================================================
  {% if home_all or home_x or home_y %}
    SET_TMC_CURRENT STEPPER=stepper_x  CURRENT={HOME_CUR_HOMING}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={HOME_CUR_HOMING}
    SET_TMC_CURRENT STEPPER=stepper_y  CURRENT={HOME_CUR_HOMING}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={HOME_CUR_HOMING}
    SET_VELOCITY_LIMIT ACCEL=500        # Reduce acceleration for gentle homing
    M400
    G4 P300                             # Let the drivers settle
  {% endif %}

  # =====================================================================
  # HOMING Y AXIS (always runs first)
  # =====================================================================
  {% if home_all or home_y %}
    G28 Y
    M400
    G91
    G1 Y-40 F2400                       # Back off 40 mm towards the front
    G90
    M400
  {% endif %}

  # =====================================================================
  # HOMING X AXIS (with Y safety check!)
  # =====================================================================
  {% if home_all or home_x %}
    # SAFETY CHECK: if Y is not homed yet, home Y first!
    {% if not home_all and 'y' not in printer.toolhead.homed_axes %}
      {action_respond_info("Sicherheitstrigger: Y ist nicht gehomed! Homing für Y wird vorgezogen.")}
      G28 Y
      M400
      G91
      G1 Y-40 F2400                     # Back off 40 mm in Y
      G90
      M400
    {% endif %}

    # Now home X
    G28 X
    M400
    G91
    G1 X-40 F2400                       # Back off 40 mm to the left
    G90
    M400
  {% endif %}

  # =====================================================================
  # RESTORE THE OPERATING CURRENT (1.5 A)
  # =====================================================================
  {% if home_all or home_x or home_y %}
    SET_TMC_CURRENT STEPPER=stepper_x  CURRENT={HOME_CUR_OPERATIONAL}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={HOME_CUR_OPERATIONAL}
    SET_TMC_CURRENT STEPPER=stepper_y  CURRENT={HOME_CUR_OPERATIONAL}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={HOME_CUR_OPERATIONAL}
    SET_VELOCITY_LIMIT ACCEL=3000       # Restore the default acceleration
    M400
  {% endif %}

  # =====================================================================
  # HOMING Z AXIS (via Cartographer at the safe position)
  # =====================================================================
  {% if home_all or home_z %}
    # If X or Y is not homed for a Z-only home, home all axes
    {% if not home_all and ('x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes) %}
      {action_respond_info("Sicherheitstrigger: X/Y nicht gehomed! Starte komplettes Homing.")}
      G28
    {% else %}
      {action_respond_info("Fahre sichere Z-Home Position an...")}
      G90
      # Center the head (350 mm bed -> 175, adjust if needed)
      G1 X175 Y175 F12000 
      M400
      {action_respond_info("Starte Z-Homing via Cartographer...")}
      G28 Z
      G1 Z10 F1200                      # Lift 10 mm after homing
    {% endif %}
  {% endif %}

  RESTORE_GCODE_STATE NAME=STATE_HOMING



[quad_gantry_level]
gantry_corners:
	-60,-10
	410,420
points:
	35,35  #25
	35,285 #305
	315,285
	315,35 #4
speed: 350
horizontal_move_z: 3
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    SAVE_GCODE_STATE NAME=STATE_QGL
    BED_MESH_CLEAR
#    # If QGL has not been done yet, correct for any major skew first
#    # at 8mm height
    {% if not printer.quad_gantry_level.applied %}
    _QUAD_GANTRY_LEVEL horizontal_move_z=15 retry_tolerance=1      
    {% endif %}
#    # Complete with a full QGL at the configured height
    _QUAD_GANTRY_LEVEL
    RESTORE_GCODE_STATE NAME=STATE_QGL







