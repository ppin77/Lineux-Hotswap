#####################################################################
# 	Macros
#####################################################################

[gcode_macro FILAMENT_UNLOAD]
description: Formt die Filamentspitze und entlädt es sicher aus dem Papilio Lite
gcode:
    {% set TARGET_TEMP = params.TARGET_TEMP|default(230)|float %}
    
    # Lock the filament sensor
    SET_GCODE_VARIABLE MACRO=_USER_VARIABLES VARIABLE=unloading VALUE=1
    
    SAVE_GCODE_STATE NAME=unload_state
    G91                             
    
    {% if printer.extruder.temperature < 190 %}
        M117 Heize auf {TARGET_TEMP}C...
        M109 S{TARGET_TEMP}
    {% endif %}
    
    M117 Forme Filamentspitze...
    M83                             
    
    G1 E5 F300                      
    G1 E-15 F3000                   
    G4 P2000                        
    
    M117 Entlade Filament...
    G1 E-60 F1200                   ; Works thanks to max_extrude_only_distance
    M400                            
    
    M117 Filament entladen!
    RESTORE_GCODE_STATE NAME=unload_state
    
    # Wait 2 seconds so the filament can be pulled out completely
    G4 P2000
    # Unlock the filament sensor
    SET_GCODE_VARIABLE MACRO=_USER_VARIABLES VARIABLE=unloading VALUE=0



