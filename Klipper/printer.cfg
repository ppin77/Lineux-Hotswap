[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28
    ##	Uncomment for for your size printer:
    #--------------------------------------------------------------------
    ##	Uncomment for 250mm build
    #G0 X125 Y125 Z30 F3600
    
    ##	Uncomment for 300 build
    #G0 X150 Y150 Z30 F3600
    
    ##	Uncomment for 350mm build
    G0 X175 Y175 Z30 F3600
    #--------------------------------------------------------------------
   
[gcode_macro PRINT_START]
gcode:
    # 1. Get parameters from the slicer (defaults if empty)
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(210)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER|default(0)|float %}

    # 2. Presets
    G90                             ; Absolute positioning
    M83                             ; Set the extruder to relative mode
    SET_GCODE_OFFSET Z=0            ; Reset the Z offset
    
    # 3. START bed heating (without waiting!)
    STATUS_HEATING                  ; LEDs to heating (bed)
    M117 Bed heating up...
    M140 S{BED_TEMP}                ; Starts heating the bed in the background
    
    # 4. IMMEDIATE homing (the printer now knows its position)
    STATUS_HOMING                   ; LEDs switch to cyan for homing
    M117 Homing for positioning...
    G28                             ; Full homing via override (X, Y and safe Z)

    # If bed >= 75°C, move to a 5cm safety distance after homing
    {% if BED_TEMP >= 75 %}
        M117 Heat protection: moving to Z50...
        G90                         ; Absolute mode
        G1 Z50 F1500                ; Move safely to 50mm height
    {% endif %}

    # Only now wait for the final bed temperature
    M117 Waiting for bed ({BED_TEMP}C)...
    M190 S{BED_TEMP}                ; Waits until the bed has reached the target temperature

    # 5. Chamber warm-up phase (heat soak) if requested by the slicer
    {% if CHAMBER_TEMP > 0 %}
        M117 Waiting for chamber ({CHAMBER_TEMP}C)...
        STATUS_HEATING              ; Back to heating while waiting
        G1 X175 Y175 Z50 F12000     ; Raise the toolhead and move to the center
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_TEMP}
    {% endif %}
    
    # ====================================================================
    # PREHEAT NOZZLE & APPROACH BEFORE MOTOR SYNC (AWD-SAFE)
    # ====================================================================
    STATUS_HEATING                  ; LEDs switch to heating (nozzle)
    M117 Nozzle heating to 150C...
    M104 S150                       ; Start heating (while moving)
    
    G90                             ; Absolute positioning
    
    # Z height based on bed temperature while preheating the nozzle
    {% if BED_TEMP >= 75 %}
        G1 Z50 F1500                ; With a hot bed, stay at a 50mm safety distance
    {% else %}
        G1 Z10 F1500                ; Stay at 10mm by default
    {% endif %}
    
    # 6. Synchronize the AWD motors at the safe position (BEFORE leveling!)
    STATUS_BUSY                     ; LEDs to busy for AWD sync
    M117 Synchronizing AWD...
    G1 X230 Y40 F12000              ; Safe pre-positioning before the motor sync
    SYNC_MOTORS                     ; The motors-sync command on the straight gantry
    M109 S150                       ; Wait until the nozzle has reached exactly 150°C

    # 7. Run quad gantry level only AFTER the sync
    STATUS_LEVELING                 ; LEDs switch to violet for QGL
    M117 Quad Gantry Level...
    QUAD_GANTRY_LEVEL               ; Levels the gantry perfectly
    
    # ====================================================================
    # CALL CLEANING MACRO (starts from X230 Y40)
    # ====================================================================
    CLEAN_NOZZLE                    ; Runs your brush moves
    
    # ====================================================================
    # AWD-SAFE: EXIT FROM THE BRUSH ZONE TO THE BED CENTER
    # ====================================================================
    G90                             ; Absolute positioning
    G1 Y40 F12000                   ; First move out of the brush trench (-4) back to Y40
    G1 X175 Y175 F12000             ; Only now move diagonally to the bed center
    G1 Z10 F1500                    ; Bring Z to a safe homing height
    
    # 9. Measure Z zero (with the freshly cleaned nozzle)
    STATUS_HOMING                   ; LEDs indicate the touch measurement
    M117 Z offset touch measurement...
    CARTOGRAPHER_TOUCH_HOME         ; Run Cartographer touch

    # 10. Create bed mesh (on the hot bed in scan mode)
    STATUS_MESHING                  ; LEDs switch to green for the bed mesh
    M117 Creating bed mesh...
    BED_MESH_CALIBRATE ADAPTIVE=1   ; Fast scan of the print area

    # ====================================================================
    # AWD-SAFE: APPROACH TO THE PRIME LINE
    # ====================================================================
    STATUS_HEATING                  ; Final heating to print temperature
    M117 Final nozzle heating...
    
    G90                             ; Absolute positioning
    G1 Z10 F1500                    ; Move to a safe Z height
    G1 Y40 F12000                   ; 1. First move forward to Y=40 (AWD-safe lane)
    G1 X1 F12000                    ; 2. Only now move left to X=1
    G1 Z0.4 F1500                   ; 3. Lower to Z=0.4 for the heating phase
    
    M109 S{EXTRUDER_TEMP}           ; Wait for the final print temperature

    # 12. Draw the prime line on the left from front (Y40) to back
    STATUS_PRINTING                 ; LEDs switch to print mode
    M117 Drawing prime line...
    G1 Z0.3 F3000                   ; Lower to first layer height
    G1 Y240 E20 F1500               ; Draw the line to the back (200mm long, 20mm filament)
    G1 X1.5 F12000                  ; Shift slightly to the side
    G1 Y42 E20 F1500                ; Second line back to the front, stopping just before the AWD limit (Y42)
    G1 Z1.0 F3000                   ; Lift the nozzle slightly
    G1 Y50 F12000                   ; Fast move to the back to break the string
    
    # 13. Start the print
    M117 Printing...





[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament

    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X125 Y250 F3600            ; park nozzle at rear
    BED_MESH_CLEAR
    
    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

[gcode_macro QUERY_HOMED_AXES]
gcode:
    { action_respond_info("Homed axes: %s" % printer.toolhead.homed_axes) }


[gcode_macro CLEAN_NOZZLE]
description: Runs the brush move to clean the nozzle (optimized approach from X230 Y40)
gcode:
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    M117 Starting nozzle cleaning...
    G90                             ; Absolute positioning
    
    # 1. X230 already fits, so move straight back to Y-4
    G1 X230 F12000
    G1 Y-9 F12000 #-4.7
    
    # 2. Lower Z to cleaning height
    G1 Z1.1 F1500 #1.3
    
    # 3. Run your brush loops
    G1 X270 F12000
    G1 Y-8.7 F12000  #-3.7
    G1 X230 F12000
    G1 Y-9 F12000
    G1 X270 F12000
    
    # 4. Last pass at Z0
    G1 Y-8.7 F12000
    G1 X230 F12000
    
    # 5. Safety lift after brushing (AWD-safe preparation)
    G91                             ; Relative positioning
    G0 Z5 F1500                     ; Lift 5mm
    
    M117 Nozzle clean!
    RESTORE_GCODE_STATE NAME=clean_nozzle_state

