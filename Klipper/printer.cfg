#####################################################################
# PRINT_START for Lineux Hotswap / BTC toolchanger
#
# Called from OrcaSlicer (see start G-code):
#   PRINT_START BED=60 EXTRUDER=220 CHAMBER=0 TOOL=1 T0_TEMP=215 T1_TEMP=220
#
#   BED       First layer bed temperature
#   EXTRUDER  Temperature of the start tool (fallback if no Tn_TEMP is passed)
#   CHAMBER   Chamber temperature (0 = no heat soak)
#   TOOL      Start tool (initial_tool from Orca)
#   Tn_TEMP   Temperature of every tool used in the print (used tools only!)
#
# Sequence:
#   1. Heat bed, home
#   2. Preheat all used tools to standby (150 C), reference tool to
#      touch temperature (140 C, Cartographer touch requires < 150 C)
#   3. Wait for bed / chamber, AWD sync, QGL
#   4. Pick reference tool (T0), clean nozzle, Cartographer touch
#   5. While the bed mesh is scanned, all used tools already heat up
#      to their print temperature
#   6. Prime lines: every used tool is picked one after another, heats
#      from standby to print temperature at the start of its line and
#      draws two short lines side by side (prime_lines). The lines are placed one after another
#      in Y (prime_y_start to prime_y_end). Only when a lane is full,
#      a new lane is started next to it in X.
#      Default (80 mm lines, Y40-330): 3 lines per lane
#        Lane 1 X2.0: T0 T1 T2 | Lane 2 X3.8: T3 T4 T5 | Lane 3 X5.6: T6
#      The start tool primes LAST and stays on the carriage.
#   7. Non-start tools go back to standby after their prime line
#      (Orca "Ooze prevention" reheats them before the tool change)
#####################################################################

[gcode_macro PRINT_START]
# ============================ SETTINGS =============================
variable_standby_temp: 150          # Preheat / standby temperature of the tools
variable_touch_temp: 140            # Nozzle temperature of the reference tool for
                                    # cleaning + Cartographer touch (must be < 150 C!)
variable_ref_tool: 0                # Tool used for nozzle cleaning + Cartographer touch
                                    # (reference of the Z offsets, with BTC = T0)
variable_prime_x: 2.0               # X of the first lane
variable_prime_lane_gap: 1.0        # Gap between two lanes in X (only if Y is not enough)
variable_prime_y_start: 40.0        # Start of the lines in Y (AWD safe rail)
variable_prime_y_end: 330.0         # End of the usable area in Y
variable_prime_length: 80.0         # Length of each prime line in mm
variable_prime_line_gap: 3.0        # Gap between two lines in Y
variable_prime_width: 0.8           # Line width in mm
variable_prime_lines: 2             # Lines per tool side by side (1 or 2)
variable_prime_height: 0.3          # Line height in mm
variable_prime_speed: 15            # mm/s while priming
variable_prime_retract: 0.8         # mm retract at the end of each prime line
variable_prime_wipe: 10.0           # mm wipe back over the end of the line
variable_filament_diameter: 1.75
gcode:
    # ================================================================
    # 1. Get parameters from the slicer
    # ================================================================
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(210)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER|default(0)|float %}

    {% set btcvar = printer["gcode_macro _BTC_VARIABLES"] %}
    {% set numoftool = btcvar.numoftool %}
    {% set START_TOOL = params.TOOL|default(btcvar.tool_current_asperbtc if btcvar.tool_current_asperbtc >= 0 else 0)|int %}

    # Collect used tools + temperatures from Tn_TEMP
    {% set ns = namespace(used=[], temps={}, order=[]) %}
    {% for t in range(7) %}
        {% set key = "T%d_TEMP" % t %}
        {% if key in params %}
            {% set ns.used = ns.used + [t] %}
            {% set _ = ns.temps.update({t: params[key]|float}) %}
        {% endif %}
    {% endfor %}

    # Fallback: no Tn_TEMP passed -> only start tool with EXTRUDER temperature
    {% if ns.used|length == 0 %}
        {% set ns.used = [START_TOOL] %}
        {% set _ = ns.temps.update({START_TOOL: EXTRUDER_TEMP}) %}
    {% endif %}
    # Start tool must always be included
    {% if START_TOOL not in ns.used %}
        {% set ns.used = ns.used + [START_TOOL] %}
        {% set _ = ns.temps.update({START_TOOL: EXTRUDER_TEMP}) %}
    {% endif %}

    # Check that all required tools are enabled in BTC
    {% for t in ns.used + [ref_tool] %}
        {% if t not in numoftool %}
            { action_raise_error("PRINT_START: T%d is required but not enabled in BTC!" % t) }
        {% endif %}
    {% endfor %}

    # Prime order: reference tool first (it is already mounted then),
    # other tools ascending, start tool last
    {% set ns.order = [] %}
    {% if ref_tool in ns.used and ref_tool != START_TOOL %}
        {% set ns.order = [ref_tool] %}
    {% endif %}
    {% for t in ns.used|sort %}
        {% if t != START_TOOL and t not in ns.order %}
            {% set ns.order = ns.order + [t] %}
        {% endif %}
    {% endfor %}
    {% set ns.order = ns.order + [START_TOOL] %}

    # Extrusion length per prime line (width x height x length / filament cross section)
    {% set fil_area = 3.14159 * (filament_diameter / 2) ** 2 %}
    {% set prime_e = prime_width * prime_height * prime_length / fil_area %}

    SET_GCODE_VARIABLE MACRO=_BTC_VARIABLES VARIABLE=tools_used_inprint VALUE='[{ns.used|sort|join(",")}]'
    { action_respond_info("PRINT_START: used tools %s, start tool T%d, prime order %s"
        % (ns.used|sort, START_TOOL, ns.order)) }

    # ================================================================
    # 2. Presets
    # ================================================================
    G90                             ; Absolute positioning
    M83                             ; Extruder in relative mode
    SET_GCODE_OFFSET Z=0            ; Reset Z offset

    # 3. START bed heating (without waiting!)
    STATUS_HEATING                  ; LEDs: heating (bed)
    M117 Bed heating...
    M140 S{BED_TEMP}                ; Start heating the bed in the background

    # 4. IMMEDIATE homing (printer knows its position)
    STATUS_HOMING                   ; LEDs: cyan for homing
    M117 Homing...
    G28                             ; Full homing via override (X, Y and safe Z)

    # ================================================================
    # PREHEAT TOOLS: all used tools + reference tool to standby
    # (runs in parallel to bed heating)
    # ================================================================
    M117 Preheating tools to {standby_temp}C...
    {% for t in ns.used if t != ref_tool %}
        M104 T{t} S{standby_temp}
    {% endfor %}
    M104 T{ref_tool} S{touch_temp}  ; Reference tool only to touch temperature

    # If bed >= 75°C, move to 5 cm safety distance after homing
    {% if BED_TEMP >= 75 %}
        M117 Heat protection: moving to Z50...
        G90                         ; Absolute mode
        G1 Z50 F1500                ; Move safely to 50 mm height
    {% endif %}

    # Now wait for the final bed temperature
    M117 Waiting for bed ({BED_TEMP}C)...
    M190 S{BED_TEMP}                ; Wait until the bed reaches the target temperature

    # 5. Chamber heat soak if requested by the slicer
    {% if CHAMBER_TEMP > 0 %}
        M117 Waiting for chamber ({CHAMBER_TEMP}C)...
        STATUS_HEATING              ; Back to heating while waiting
        G1 X175 Y175 Z50 F12000     ; Move head up and to the center
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_TEMP}
    {% endif %}

    # ================================================================
    # SAFE HEIGHT BEFORE MOTOR SYNC
    # ================================================================
    G90                             ; Absolute positioning

    # Z height depending on bed temperature
    {% if BED_TEMP >= 75 %}
        G1 Z50 F1500                ; Hot bed: stay at 50 mm safety distance
    {% else %}
        G1 Z10 F1500                ; Default: stay at 10 mm
    {% endif %}

    # 6. Sync AWD motors (BEFORE leveling!)
    # motors_sync moves to the axis center (X175 Y170.5) by itself,
    # so no pre-positioning is needed. Z stays at the height above.
    STATUS_BUSY                     ; LEDs: busy for AWD sync
    M117 Syncing AWD...
    SYNC_MOTORS                     ; motors-sync command

    # 7. Quad gantry level only AFTER the sync
    STATUS_LEVELING                 ; LEDs: purple for QGL
    M117 Quad gantry level...
    QUAD_GANTRY_LEVEL               ; Level the gantry

    # ================================================================
    # PICK REFERENCE TOOL (touch + mesh always with T{ref_tool})
    # ================================================================
    SANITY_CHECK_TOOLS FAILURE=1    ; Carriage sensor and BTC state must match
    M117 Picking reference tool T{ref_tool}...
    G90
    G1 Z10 F1500
    T{ref_tool}                     ; BTC drops the mounted tool if needed and picks T{ref_tool}

    # Nozzle must be between touch_temp - 5 and touch_temp + 3 (never >= 150°C for the touch).
    # TEMPERATURE_WAIT also waits for cooling down, M109 would not.
    {% set ref_heater = "extruder" if ref_tool == 0 else "extruder%d" % ref_tool %}
    M117 T{ref_tool}: waiting for {touch_temp}C...
    M104 T{ref_tool} S{touch_temp}
    TEMPERATURE_WAIT SENSOR={ref_heater} MINIMUM={touch_temp - 5} MAXIMUM={touch_temp + 3}

    # Back to the start position of the cleaning (AWD safe)
    G90
    G1 Z10 F1500
    G1 Y40 F12000
    G1 X230 F12000

    # ================================================================
    # CALL CLEANING MACRO (starts from X230 Y40)
    # ================================================================
    CLEAN_NOZZLE                    ; Runs the brush moves

    # ================================================================
    # AWD SAFE: LEAVE THE BRUSH ZONE TO THE BED CENTER
    # ================================================================
    G90                             ; Absolute positioning
    G1 Y40 F12000                   ; First move out of the brush trench to Y40
    G1 X175 Y175 F12000             ; Only then diagonally to the bed center
    G1 Z10 F1500                    ; Z to safe homing height

    # 9. Measure Z zero (on the freshly cleaned nozzle)
    STATUS_HOMING                   ; LEDs: touch measurement
    M117 Z offset touch...
    CARTOGRAPHER_TOUCH_HOME         ; Run Cartographer touch

    # Touch is done -> all used tools start heating to print temperature
    # while the bed mesh is scanned (no waiting here)
    M117 Heating tools to print temperature...
    {% for t in ns.order %}
        M104 T{t} S{ns.temps[t]}
    {% endfor %}

    # 10. Create bed mesh (hot bed, scan mode)
    STATUS_MESHING                  ; LEDs: green for bed mesh
    M117 Creating bed mesh...
    BED_MESH_CALIBRATE ADAPTIVE=1   ; Fast scan of the print area

    # Reference tool is not used in the print -> turn it off
    {% if ref_tool not in ns.used %}
        M104 T{ref_tool} S0
    {% endif %}

    # ================================================================
    # PRIME LINES: one tool after another, start tool last
    # ================================================================
    {% for t in ns.order %}
        {% set lines_per_lane = ((prime_y_end - prime_y_start + prime_line_gap) // (prime_length + prime_line_gap))|int %}
        {% set lane = (t // lines_per_lane)|int %}
        {% set pos = t % lines_per_lane %}
        {% set lane_x = prime_x + lane * (prime_lines * prime_width + prime_lane_gap) %}
        {% set lane_y = prime_y_start + pos * (prime_length + prime_line_gap) %}
        {% set is_last = loop.last %}

        STATUS_HEATING
        M117 T{t}: preparing prime line...
        G90
        G1 Z10 F1500                ; Safe height for the tool change
        T{t}                        ; Pick tool (BTC drops the previous one)

        # AWD SAFE: approach to the tool's own lane
        G90
        G1 Z10 F1500
        G1 Y{prime_y_start} F12000  ; 1. First onto the Y rail
        G1 X{lane_x} F12000         ; 2. Then in X to the lane of T{t}
        G1 Y{lane_y} F12000         ; 3. To the start point of the line
        G1 Z0.4 F1500               ; 4. Lower for the heating phase

        M117 T{t}: heating to {ns.temps[t]}C...
        M109 T{t} S{ns.temps[t]}    ; Wait for print temperature (already heating since the mesh)

        STATUS_PRINTING
        M117 T{t}: prime line...
        G1 Z{prime_height} F3000                                   ; Line height
        G1 Y{lane_y + prime_length} E{prime_e|round(2)} F{prime_speed * 60}  ; Line 1 (forward)
        {% if prime_lines >= 2 %}
            G1 X{lane_x + prime_width} E{(prime_e * prime_width / prime_length)|round(3)} F{prime_speed * 60}  ; Step over to line 2
            G1 Y{lane_y} E{prime_e|round(2)} F{prime_speed * 60}   ; Line 2 (back, right next to line 1)
            {% set end_y = lane_y %}
            {% set wipe_y = lane_y + prime_wipe %}
        {% else %}
            {% set end_y = lane_y + prime_length %}
            {% set wipe_y = lane_y + prime_length - prime_wipe %}
        {% endif %}
        G1 E-{prime_retract} F2400                                 ; Retract against stringing
        G1 Z{prime_height + 0.2} F3000                             ; Just above the line
        G1 Y{wipe_y} F6000                                         ; Wipe back over the last line
        G1 Z1.0 F3000                                              ; Lift nozzle

        {% if not is_last %}
            G1 Z10 F1500            ; Lift so the next tool change does not drag over the lines
            M104 T{t} S{standby_temp}  ; Back to standby until first use
        {% endif %}
    {% endfor %}

    # 13. Start print (start tool is on the carriage and hot)
    M117 Printing...





#####################################################################
# PRINT_END, PAUSE, RESUME and CANCEL_PRINT for Lineux Hotswap / BTC
#
# Based on the examples in Lineux Hotswap btc_extras.cfg, adapted to
# this printer (fixed dock, 7 tools, Fluidd client macros).
#
# PAUSE / RESUME / CANCEL_PRINT are NOT redefined here. They already
# come from fluidd.cfg (read-only). The toolchanger parts are added via
# the hooks of _CLIENT_VARIABLE (user_pause_macro, user_resume_macro,
# user_cancel_macro), so there is no conflict with fluidd.cfg.
#
# These macros replace the PRINT_END sample in btc_extras.cfg.
#####################################################################


#####################################################################
# PRINT_END
#####################################################################
[gcode_macro PRINT_END]
# ============================ SETTINGS =============================
variable_retract: 3.0          # mm filament retract at the end
variable_park_x: 125.0          # Park position of the empty carriage
variable_park_y: 250.0
variable_park_speed: 60         # mm/s
gcode:
    {% set btcvar = printer["gcode_macro _BTC_VARIABLES"] %}
    {% set numoftool = btcvar.numoftool %}
    {% set active_tool = btcvar.tool_current_asperbtc|int %}

    # Determine safe directions for the small move away from the print
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set pos = printer.toolhead.position %}
    {% set x_safe = 20.0 if pos.x < (max_x - 25) else -20.0 %}
    {% set y_safe = 20.0 if pos.y < (max_y - 25) else -20.0 %}
    {% set z_safe = 3.0 if pos.z < (max_z - 5) else 0.0 %}

    M400                            ; Wait for buffer to clear
    G92 E0                          ; Zero the extruder
    G1 E-{retract} F3600            ; Retract filament

    G91                             ; Relative positioning
    G0 Z1.0 X{x_safe} Y{y_safe} F20000  ; Move nozzle away to remove stringing
    G1 Z{z_safe} F3000              ; Lift nozzle
    G90                             ; Absolute positioning

    # --- Turn off all tool heaters + bed (other heaters, e.g. the
    #     filament dryer, are NOT touched) ---
    {% for t in numoftool %}
        M104 T{t} S0
    {% endfor %}
    M140 S0
    M107                            ; Part cooling fan off

    # --- Drop the active tool into its dock ---
    {% if active_tool >= 0 %}
        { action_respond_info("PRINT_END: dropping off T%d" % active_tool) }
        TOOL_DROPOFF TOOLNUMBER={active_tool}
    {% else %}
        { action_respond_info("PRINT_END: no tool on the carriage") }
    {% endif %}

    SET_GCODE_OFFSET X=0 Y=0 Z=0    ; No tool on the carriage -> no tool offsets

    # --- Park the empty carriage ---
    G90
    G0 X{park_x} Y{park_y} F{park_speed * 60}

    BED_MESH_CLEAR
    SET_GCODE_VARIABLE MACRO=_BTC_VARIABLES VARIABLE=tools_used_inprint VALUE=[]
    M117 Finished!


#####################################################################
# Fluidd client settings (PAUSE / RESUME / CANCEL_PRINT from fluidd.cfg)
#####################################################################
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True   ; Park position on PAUSE
variable_custom_park_x    : 125.0
variable_custom_park_y    : 250.0
variable_custom_park_dz   : 2.0    ; Lift on PAUSE in mm
variable_retract          : 1.0    ; Retract on PAUSE
variable_cancel_retract   : 5.0    ; Retract on CANCEL_PRINT
variable_speed_retract    : 35.0
variable_unretract        : 1.0    ; Unretract on RESUME
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : False  ; Parking on cancel is done by _BTC_CANCEL_HOOK
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
variable_use_fw_retract   : False
variable_idle_timeout     : 0
variable_runout_sensor    : ""
variable_user_pause_macro : "_BTC_PAUSE_HOOK"
variable_user_resume_macro: "_BTC_RESUME_HOOK"
variable_user_cancel_macro: "_BTC_CANCEL_HOOK"
gcode:


#####################################################################
# Toolchanger hooks
#####################################################################
[gcode_macro _BTC_PAUSE_HOOK]
description: Remember which tool was on the carriage when the print was paused
variable_paused_tool: -1
gcode:
    {% set t = printer["gcode_macro _BTC_VARIABLES"].tool_current_asperbtc|int %}
    SET_GCODE_VARIABLE MACRO=_BTC_PAUSE_HOOK VARIABLE=paused_tool VALUE={t}
    { action_respond_info("PAUSE: active tool T%d" % t if t >= 0 else "PAUSE: no active tool (tool change failed?)") }


[gcode_macro _BTC_RESUME_HOOK]
description: Check the tool state before resuming
gcode:
    {% set paused = printer["gcode_macro _BTC_PAUSE_HOOK"].paused_tool|int %}
    {% set current = printer["gcode_macro _BTC_VARIABLES"].tool_current_asperbtc|int %}

    # Carriage sensor and BTC state must match, otherwise RESUME is aborted
    SANITY_CHECK_TOOLS FAILURE=1

    {% if current < 0 %}
        { action_raise_error("RESUME aborted: no tool registered on the carriage. Mount the tool and run RECOVER_WITH_TOOL TOOL=n first.") }
    {% endif %}

    # A different tool than at PAUSE would print with the wrong offsets,
    # because RESUME restores the G-code state of the pause moment.
    {% if paused >= 0 and current != paused %}
        { action_raise_error("RESUME aborted: T%d was active at PAUSE, now T%d is mounted. Pick T%d again (T%d) and then RESUME." % (paused, current, paused, paused)) }
    {% endif %}


[gcode_macro _BTC_CANCEL_HOOK]
description: Drop the active tool and park the carriage on CANCEL_PRINT
variable_dropoff_on_cancel: True   ; False = leave the tool on the carriage
gcode:
    {% set t = printer["gcode_macro _BTC_VARIABLES"].tool_current_asperbtc|int %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set qgl_ok = printer.quad_gantry_level.applied if printer.quad_gantry_level is defined else True %}
    {% set pe = printer["gcode_macro PRINT_END"] %}

    {% if dropoff_on_cancel and t >= 0 %}
        {% if 'x' in homed and 'y' in homed and 'z' in homed and qgl_ok %}
            { action_respond_info("CANCEL_PRINT: dropping off T%d" % t) }
            TOOL_DROPOFF TOOLNUMBER={t}
            SET_GCODE_OFFSET X=0 Y=0 Z=0
            G90
            G0 X{pe.park_x} Y{pe.park_y} F{pe.park_speed * 60}
        {% else %}
            { action_respond_info("CANCEL_PRINT: not homed / no QGL - T%d stays on the carriage" % t) }
        {% endif %}
    {% endif %}
    BED_MESH_CLEAR


[gcode_macro QUERY_HOMED_AXES]
gcode:
    { action_respond_info("Gehomte Achsen: %s" % printer.toolhead.homed_axes) }

####################################CLEAN NOZZLE ###############################
[gcode_macro CLEAN_NOZZLE]
description: Führt die Bürst-Bewegung zur Düsenreinigung aus (optimierte Anfahrt von X230 Y40)
gcode:
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    M117 Starte Düsenreinigung...
    G90                             ; Absolute positioning
    
    # 1. Start at X230, move straight to the brush in Y
    G1 X230 F12000
    G1 Y-1 F12000 #-4.7
    
    # 2. Lower Z to cleaning height
    G1 Z0 F1500 #1.3
    
    # 3. Brush passes
    G1 X270 F12000
    G1 Y-0.5 F12000  #-3.7
    G1 X230 F12000
    G1 Y0 F12000
    G1 X270 F12000
    
    # 4. Last pass
    G1 Y0.8 F12000
    G1 X230 F12000
    
    # 5. Lift after brushing (AWD safe)
    G91                             ; Relative positioning
    G0 Z5 F1500                     ; Lift 5 mm
    
    M117 Düse sauber!
    RESTORE_GCODE_STATE NAME=clean_nozzle_state

