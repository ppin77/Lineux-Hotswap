# ============================================================
# Lineux Hotswap Dock Location Calibration
# ============================================================
[dock_locate_calibrate]

# ------------------------------------------------------------
# MCU position resolution
# ------------------------------------------------------------
# This depends on the printer's stepper configuration.
# Current value for this calibration:
#   
#   rotation_distance: 40
#   full_steps_per_rotation: 200
#
# If you use a different value above, you must do your own
# calculation and change the xy_resolution yourself.

# xy_resolution: 0.0125           # Uncomment this if using 16 microsteps
# xy_resolution: 0.00625        # Uncomment this if using 32 microsteps
xy_resolution: 0.003125       # Uncomment this if using 64 microsteps

# ------------------------------------------------------------
# Printer X/Y homing positions
# ------------------------------------------------------------
# IMPORTANT:
# These are the actual X/Y position_endstop values.
# They are NOT the bed size and NOT position_max.
x_endstop: 350
y_endstop: 350

# ------------------------------------------------------------
# Calibration movement
# ------------------------------------------------------------
# Distance and direction the carriage moves before homing.
# Positive = X positive direction
# Negative = X negative direction
# Example:
#   3.0  = move X +3mm
#  -3.0  = move X -3mm
calibrate_move_x: 3.0

# Optional: Y movement AFTER the X movement, BEFORE homing.
# Pulls the toolhead out of the dock so the Z hop of the
# homing_override cannot hit the dock.
# Front dock: positive value (towards the rear). 0 = disabled.
calibrate_move_y: 40.0
# ============================================================
# Fluidd Button
# ============================================================
[gcode_macro DOCK_CALIBRATION]
description: Start Lineux Hotswap Dock Location Calibration
gcode:
    DOCK_LOCATE_CALIBRATE

[gcode_macro XY_MOTORS_OFF]
description: Disable X/Y motors (Z stays enabled)
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_x1 ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_y1 ENABLE=0
  { action_respond_info("X/Y motors disabled") }

[gcode_macro XY_MOTORS_ON]
description: Enable X/Y motors (holds the toolhead in place, no move)
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_x1 ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_y1 ENABLE=1
  { action_respond_info("X/Y motors enabled") }