#####################################################################
# Lineux Hotswap - Fixed mounted dock (replacement for Dockslide)
#
# Provides DOCKSLIDE_DEPLOY and DOCKSLIDE_PARK, so the tool moves
# from the Tool Moves Generator work without changes.
#
# Include in btc_variables.cfg INSTEAD of dockslide.cfg:
#   # [include ./dockslide.cfg]
#   [include ./fixed_dock.cfg]
#
# Sequence:
#   DOCKSLIDE_DEPLOY: save current Z height -> move to safe_y
#                     -> move to dock_z
#   DOCKSLIDE_PARK:   move to safe_y -> return to saved Z height
#
# All positions are real machine coordinates. Active G-code
# offsets (e.g. tool Z offset) are compensated automatically.
#####################################################################

[gcode_macro _FIXED_DOCK_VARIABLES]
# ========================== SETTINGS ===============================
variable_safe_y: 35.0         # Y position that can always be reached
                              # without collision (even with a tall print)
variable_dock_z: 251.0        # Z height at which the toolhead enters the dock
variable_travel_speed: 500    # mm/s for the move to safe_y
variable_z_speed: 140 #150 #15     # mm/s for Z moves
variable_z_tolerance: 0.5     # mm - if Z is closer than this to dock_z,
                              # the toolhead counts as "already at dock height"
variable_require_qgl: True    # True = abort docking if QUAD_GANTRY_LEVEL
                              # has not been run (dock_z depends on it)
# ============== Runtime variables - DO NOT CHANGE ==================
variable_saved_z: -1.0
variable_deployed: False
gcode:
  # Placeholder, so Klipper accepts this section


[gcode_macro DOCKSLIDE_DEPLOY]
description: Fixed Dock - save Z, move to safe_y, move to dock height
gcode:
  {% set v = printer["gcode_macro _FIXED_DOCK_VARIABLES"] %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
    { action_raise_error("Fixed Dock: X, Y and Z must be homed!") }
  {% endif %}

  # Safety check: gantry must be leveled, otherwise dock_z is not reliable
  {% if v.require_qgl %}
    {% if printer.quad_gantry_level is not defined %}
      { action_raise_error("Fixed Dock: require_qgl is True, but no [quad_gantry_level] section found!") }
    {% elif not printer.quad_gantry_level.applied %}
      { action_raise_error("Fixed Dock: QUAD_GANTRY_LEVEL has not been run! Run G28 and QUAD_GANTRY_LEVEL first.") }
    {% endif %}
  {% endif %}

  {% set off_y = printer.gcode_move.homing_origin.y %}
  {% set off_z = printer.gcode_move.homing_origin.z %}
  {% set cur_z = printer.toolhead.position.z %}
  {% set at_dock = (cur_z - v.dock_z)|abs <= v.z_tolerance %}

  # Only save Z if we are not already deployed at dock height.
  # (During a tool change BTC calls DEPLOY twice: dropoff and
  #  pickup. The second call must not overwrite the print height.)
  {% if not v.deployed or not at_dock %}
    SET_GCODE_VARIABLE MACRO=_FIXED_DOCK_VARIABLES VARIABLE=saved_z VALUE={cur_z}
    { action_respond_info("Fixed Dock: Z=%.3f saved" % cur_z) }
  {% endif %}

  SAVE_GCODE_STATE NAME=_FIXED_DOCK_STATE
  G90
  G0 Y{v.safe_y - off_y} F{v.travel_speed * 60}
  G0 Z{v.dock_z - off_z} F{v.z_speed * 60}
  RESTORE_GCODE_STATE NAME=_FIXED_DOCK_STATE

  SET_GCODE_VARIABLE MACRO=_FIXED_DOCK_VARIABLES VARIABLE=deployed VALUE=True


[gcode_macro DOCKSLIDE_PARK]
description: Fixed Dock - move to safe_y, return to saved Z height
gcode:
  {% set v = printer["gcode_macro _FIXED_DOCK_VARIABLES"] %}
  {% set off_y = printer.gcode_move.homing_origin.y %}
  {% set off_z = printer.gcode_move.homing_origin.z %}

  {% if v.deployed and v.saved_z >= 0 %}
    SAVE_GCODE_STATE NAME=_FIXED_DOCK_STATE
    G90
    G0 Y{v.safe_y - off_y} F{v.travel_speed * 60}
    G0 Z{v.saved_z - off_z} F{v.z_speed * 60}
    RESTORE_GCODE_STATE NAME=_FIXED_DOCK_STATE
    { action_respond_info("Fixed Dock: back to Z=%.3f" % v.saved_z) }
  {% else %}
    { action_respond_info("Fixed Dock: no saved Z height, Z unchanged") }
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_FIXED_DOCK_VARIABLES VARIABLE=deployed VALUE=False
  SET_GCODE_VARIABLE MACRO=_FIXED_DOCK_VARIABLES VARIABLE=saved_z VALUE=-1.0


[gcode_macro FIXED_DOCK_SAFE_Y]
description: Fixed Dock - move to safe_y (X and Z unchanged)
gcode:
  # Can be used in the tool moves instead of a fixed Y coordinate:
  #   "FIXED_DOCK_SAFE_Y SPEED=300"
  # SPEED in mm/s, default: travel_speed
  {% set v = printer["gcode_macro _FIXED_DOCK_VARIABLES"] %}
  {% set off_y = printer.gcode_move.homing_origin.y %}
  {% set speed = params.SPEED|default(v.travel_speed)|float %}
  SAVE_GCODE_STATE NAME=_FIXED_DOCK_SAFE_Y_STATE
  G90
  G0 Y{v.safe_y - off_y} F{speed * 60}
  RESTORE_GCODE_STATE NAME=_FIXED_DOCK_SAFE_Y_STATE


[gcode_macro FIXED_DOCK_STATUS]
description: Fixed Dock - show status and settings
gcode:
  {% set v = printer["gcode_macro _FIXED_DOCK_VARIABLES"] %}
  {% set qgl = printer.quad_gantry_level.applied if printer.quad_gantry_level is defined else "n/a" %}
  { action_respond_info("Fixed Dock: safe_y=%.2f dock_z=%.2f deployed=%s saved_z=%.3f require_qgl=%s qgl_applied=%s"
      % (v.safe_y, v.dock_z, v.deployed, v.saved_z, v.require_qgl, qgl)) }
