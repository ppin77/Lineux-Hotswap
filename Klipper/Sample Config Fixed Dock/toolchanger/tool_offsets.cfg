#####################################################################
# Persistent tool offsets for BTC (Lineux Hotswap)
#
# Offsets measured with TOOLS_CALIBRATE_ALL are stored with Klipper's
# [save_variables] in tool_offsets_saved.cfg and applied to BTC at
# every Klipper start. No restart and no manual editing of tool_N.cfg
# is needed.
#
# Priority:
#   saved offset (tool_offsets_saved.cfg)  >  xoffset/yoffset/zoffset in tool_N.cfg
#   The values in tool_N.cfg are only used for tools without a saved offset.
#
# Commands:
#   TOOL_OFFSETS_SHOW            - show saved and active offsets of all tools
#   TOOL_OFFSET_SET TOOL=1 X=.. Y=.. Z=..
#                                - save + apply an offset by hand (e.g. Z fine tuning)
#   TOOL_OFFSET_CLEAR TOOL=1     - delete the saved offset, tool_N.cfg applies
#                                  again after the next Klipper restart
#
# New offsets are used from the next pickup of the tool on
# (BTC sets them with SET_GCODE_OFFSET when the tool is picked up).
#
# Include in btc_variables.cfg (only once, there may be only one
# [save_variables] section in the whole config):
#   [include ./tool_offsets.cfg]
#####################################################################

[save_variables]
filename: ~/printer_data/config/toolchanger/tool_offsets_saved.cfg


# Apply the saved offsets at Klipper start (before the BTC start
# routine, which runs after 3 s)
[delayed_gcode _TOOL_OFFSETS_RESTORE]
initial_duration: 1
gcode:
  _TOOL_OFFSETS_APPLY


[gcode_macro _TOOL_OFFSETS_APPLY]
description: Apply all saved tool offsets to BTC
gcode:
  {% set sv = printer.save_variables.variables %}
  {% for t in range(10) %}
    {% set key = "tool%d_offset" % t %}
    {% set macro = "gcode_macro _VARIABLES_T%d" % t %}
    {% if key in sv and sv[key] is not none and macro in printer %}
      {% set o = sv[key] %}
      SET_GCODE_VARIABLE MACRO=_VARIABLES_T{t} VARIABLE=xoffset VALUE={o[0]}
      SET_GCODE_VARIABLE MACRO=_VARIABLES_T{t} VARIABLE=yoffset VALUE={o[1]}
      SET_GCODE_VARIABLE MACRO=_VARIABLES_T{t} VARIABLE=zoffset VALUE={o[2]}
      { action_respond_info("Tool offsets: T%d X=%.3f Y=%.3f Z=%.3f (saved)" % (t, o[0], o[1], o[2])) }
    {% endif %}
  {% endfor %}


[gcode_macro TOOL_OFFSET_SET]
description: Save and apply an XYZ offset for one tool (TOOL=n X= Y= Z=)
gcode:
  {% set t = params.TOOL|int %}
  {% set macro = "gcode_macro _VARIABLES_T%d" % t %}
  {% if macro not in printer %}
    { action_raise_error("TOOL_OFFSET_SET: _VARIABLES_T%d does not exist (tool not enabled?)" % t) }
  {% endif %}
  {% set cur = printer[macro] %}
  {% set x = params.X|default(cur.xoffset)|float %}
  {% set y = params.Y|default(cur.yoffset)|float %}
  {% set z = params.Z|default(cur.zoffset)|float %}
  SAVE_VARIABLE VARIABLE=tool{t}_offset VALUE=[{x|round(4)},{y|round(4)},{z|round(4)}]
  SET_GCODE_VARIABLE MACRO=_VARIABLES_T{t} VARIABLE=xoffset VALUE={x|round(4)}
  SET_GCODE_VARIABLE MACRO=_VARIABLES_T{t} VARIABLE=yoffset VALUE={y|round(4)}
  SET_GCODE_VARIABLE MACRO=_VARIABLES_T{t} VARIABLE=zoffset VALUE={z|round(4)}
  { action_respond_info("Tool offsets: T%d saved X=%.3f Y=%.3f Z=%.3f (active from the next pickup)" % (t, x, y, z)) }


[gcode_macro TOOL_OFFSET_CLEAR]
description: Delete the saved offset of one tool (TOOL=n)
gcode:
  {% set t = params.TOOL|int %}
  SAVE_VARIABLE VARIABLE=tool{t}_offset VALUE=None
  { action_respond_info("Tool offsets: saved offset of T%d deleted - tool_%d.cfg applies after the next Klipper restart" % (t, t)) }


[gcode_macro TOOL_OFFSETS_SHOW]
description: Show saved and active offsets of all tools
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set ns = namespace(lines=[]) %}
  {% for t in range(10) %}
    {% set macro = "gcode_macro _VARIABLES_T%d" % t %}
    {% if macro in printer %}
      {% set v = printer[macro] %}
      {% set key = "tool%d_offset" % t %}
      {% set src = "saved" if (key in sv and sv[key] is not none) else "tool_%d.cfg" % t %}
      {% set ns.lines = ns.lines + ["T%d: X=%.3f Y=%.3f Z=%.3f (%s)" % (t, v.xoffset, v.yoffset, v.zoffset, src)] %}
    {% endif %}
  {% endfor %}
  { action_respond_info("Tool offsets:\n" + ns.lines|join("\n")) }
