#######################################################################
# These are example macros you can/should use when using Lineux Hotswap
# You have to understand fully what each line means/do
# This file is not designed to be included directly in your config,
# these provides examples what your print_start macro should look like
# Please ask in discord if you need help with configuration
#######################################################################

# Sample macros:
#
# print_start
# print_end
# homing_overide
# pause
# resume
#
# PLEASE use these super simple and useful tools before going live!! Thanks to @irrenhaus
# Utility macros:
# Get_Tool_States    - Prints the dock sense and carriage sense switch status for all tools to the console
# Sanity_Check_Tools - Sanity checks the carriage sense switch
#                        If parameter FAILURE is set to 1 this will raise an error if a check is failed (for out-of-print usage)
#                        If parameter PAUSE is set to 1 this will run the PAUSE macro if a check is failed (for in-print usage)
#                        If no parameter is set to 1 this will put the printer into emergency stop if a check is failed (for startup usage)
#
################################################################
# Print Start macro
#	combined print start gcode macro that takes into account temperature from the slicer
[gcode_macro PRINT_START]
gcode:
    {% set tools_used_inprint = [] %}
    {% set BED_TEMP = params.BED_TEMP|default(100)|float %}
    {% set EXTRUDER_TEMP = params.TOOL_TEMP|default(190)|float %}
    {% set cur_tool = params.TOOL|int %}
    {% if params.TEMP_T0 is defined %}
      {% set TEMP_T0 = params.TEMP_T0|float %}
      {% set tools_used_inprint = tools_used_inprint + [0] %}
    {% endif %}
    {% if params.TEMP_T1 is defined %}
      {% set TEMP_T1 = params.TEMP_T1|float %}
      {% set tools_used_inprint = tools_used_inprint + [1] %}
    {% endif %}
    {% if params.TEMP_T2 is defined %}
      {% set TEMP_T2 = params.TEMP_T2|float %}
      {% set tools_used_inprint = tools_used_inprint + [2] %}
    {% endif %}
    {% if params.TEMP_T3 is defined %}
      {% set TEMP_T3 = params.TEMP_T3|float %}
      {% set tools_used_inprint = tools_used_inprint + [3] %}
    {% endif %}
    {% if params.TEMP_T4 is defined %}
      {% set TEMP_T4 = params.TEMP_T4|float %}
      {% set tools_used_inprint = tools_used_inprint + [4] %}
    {% endif %}
    {% if params.TEMP_T5 is defined %}
      {% set TEMP_T5 = params.TEMP_T5|float %}
      {% set tools_used_inprint = tools_used_inprint + [5] %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_BTC_VARIABLES VARIABLE=tools_used_inprint VALUE='{tools_used_inprint}'

    {% set numoftool = printer["gcode_macro _BTC_VARIABLES"].numoftool %}
    {% for toolnumber in numoftool %}
    {% endfor %}
    {% for toolnumber in tools_used_inprint %}
      {% if (toolnumber in numoftool) %}
      {% else %}
        { action_raise_error("Tool %d is used in this print, but disabled!" % (toolnumber)) }
      {% endif %}
    {% endfor %}
    M190 S{BED_TEMP}            ; Wait for bed to reach temperature
    status_homing				; Printer Led Status
    M117 Homing...              ; display message
    G28         				; Home All
    Z_Tilt_Adjust           	; Z Tilt
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=1
    	
########################################################################################

########################################################################################
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script
#
#   PRINT_END plus Fluidd PAUSE / RESUME / CANCEL_PRINT hooks, adapted to a
#   printer with a fixed dock, 7 tools and the Fluidd client macros.
#
#   The hooks below do NOT redefine PAUSE / RESUME / CANCEL_PRINT. Those
#   come from fluidd.cfg (read-only). The toolchanger parts are added via
#   the hooks of _CLIENT_VARIABLE (user_pause_macro, user_resume_macro,
#   user_cancel_macro), so there is no conflict with fluidd.cfg.
#
#   Remove any other [gcode_macro PRINT_END] (e.g. in printer.cfg) when
#   using this one. Note that the sample PAUSE and RESUME macros further
#   down in this file override the ones from fluidd.cfg - remove them if
#   you use the Fluidd client macros with the hooks below.
# ============================ SETTINGS =============================
variable_retract: 3.0          # mm filament retract at the end
variable_park_x: 125.0          # Park position of the empty carriage
variable_park_y: 250.0
variable_park_speed: 60         # mm/s
gcode:
    {% set btcvar = printer["gcode_macro _BTC_VARIABLES"] %}
    {% set numoftool = btcvar.numoftool %}
    {% set active_tool = btcvar.tool_current_asperbtc|int %}

    # Determine safe directions for the small move away from the print
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set pos = printer.toolhead.position %}
    {% set x_safe = 20.0 if pos.x < (max_x - 25) else -20.0 %}
    {% set y_safe = 20.0 if pos.y < (max_y - 25) else -20.0 %}
    {% set z_safe = 3.0 if pos.z < (max_z - 5) else 0.0 %}

    M400                            ; Wait for buffer to clear
    G92 E0                          ; Zero the extruder
    G1 E-{retract} F3600            ; Retract filament

    G91                             ; Relative positioning
    G0 Z1.0 X{x_safe} Y{y_safe} F20000  ; Move nozzle away to remove stringing
    G1 Z{z_safe} F3000              ; Lift nozzle
    G90                             ; Absolute positioning

    # --- Turn off all tool heaters + bed (other heaters, e.g. the
    #     filament dryer, are NOT touched) ---
    {% for t in numoftool %}
        M104 T{t} S0
    {% endfor %}
    M140 S0
    M107                            ; Part cooling fan off

    # --- Drop the active tool into its dock ---
    {% if active_tool >= 0 %}
        { action_respond_info("PRINT_END: dropping off T%d" % active_tool) }
        TOOL_DROPOFF TOOLNUMBER={active_tool}
    {% else %}
        { action_respond_info("PRINT_END: no tool on the carriage") }
    {% endif %}

    SET_GCODE_OFFSET X=0 Y=0 Z=0    ; No tool on the carriage -> no tool offsets

    # --- Park the empty carriage ---
    G90
    G0 X{park_x} Y{park_y} F{park_speed * 60}

    BED_MESH_CLEAR
    SET_GCODE_VARIABLE MACRO=_BTC_VARIABLES VARIABLE=tools_used_inprint VALUE=[]
    M117 Finished!


#####################################################################
# Fluidd client settings (PAUSE / RESUME / CANCEL_PRINT from fluidd.cfg)
#####################################################################
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True   ; Park position on PAUSE
variable_custom_park_x    : 125.0
variable_custom_park_y    : 250.0
variable_custom_park_dz   : 2.0    ; Lift on PAUSE in mm
variable_retract          : 1.0    ; Retract on PAUSE
variable_cancel_retract   : 5.0    ; Retract on CANCEL_PRINT
variable_speed_retract    : 35.0
variable_unretract        : 1.0    ; Unretract on RESUME
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : False  ; Parking on cancel is done by _BTC_CANCEL_HOOK
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
variable_use_fw_retract   : False
variable_idle_timeout     : 0
variable_runout_sensor    : ""
variable_user_pause_macro : "_BTC_PAUSE_HOOK"
variable_user_resume_macro: "_BTC_RESUME_HOOK"
variable_user_cancel_macro: "_BTC_CANCEL_HOOK"
gcode:


#####################################################################
# Toolchanger hooks
#####################################################################
[gcode_macro _BTC_PAUSE_HOOK]
description: Remember which tool was on the carriage when the print was paused
variable_paused_tool: -1
gcode:
    {% set t = printer["gcode_macro _BTC_VARIABLES"].tool_current_asperbtc|int %}
    SET_GCODE_VARIABLE MACRO=_BTC_PAUSE_HOOK VARIABLE=paused_tool VALUE={t}
    { action_respond_info("PAUSE: active tool T%d" % t if t >= 0 else "PAUSE: no active tool (tool change failed?)") }


[gcode_macro _BTC_RESUME_HOOK]
description: Check the tool state before resuming
gcode:
    {% set paused = printer["gcode_macro _BTC_PAUSE_HOOK"].paused_tool|int %}
    {% set current = printer["gcode_macro _BTC_VARIABLES"].tool_current_asperbtc|int %}

    # Carriage sensor and BTC state must match, otherwise RESUME is aborted
    SANITY_CHECK_TOOLS FAILURE=1

    {% if current < 0 %}
        { action_raise_error("RESUME aborted: no tool registered on the carriage. Mount the tool and run RECOVER_WITH_TOOL TOOL=n first.") }
    {% endif %}

    # A different tool than at PAUSE would print with the wrong offsets,
    # because RESUME restores the G-code state of the pause moment.
    {% if paused >= 0 and current != paused %}
        { action_raise_error("RESUME aborted: T%d was active at PAUSE, now T%d is mounted. Pick T%d again (T%d) and then RESUME." % (paused, current, paused, paused)) }
    {% endif %}


[gcode_macro _BTC_CANCEL_HOOK]
description: Drop the active tool and park the carriage on CANCEL_PRINT
variable_dropoff_on_cancel: True   ; False = leave the tool on the carriage
gcode:
    {% set t = printer["gcode_macro _BTC_VARIABLES"].tool_current_asperbtc|int %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set qgl_ok = printer.quad_gantry_level.applied if printer.quad_gantry_level is defined else True %}
    {% set pe = printer["gcode_macro PRINT_END"] %}

    {% if dropoff_on_cancel and t >= 0 %}
        {% if 'x' in homed and 'y' in homed and 'z' in homed and qgl_ok %}
            { action_respond_info("CANCEL_PRINT: dropping off T%d" % t) }
            TOOL_DROPOFF TOOLNUMBER={t}
            SET_GCODE_OFFSET X=0 Y=0 Z=0
            G90
            G0 X{pe.park_x} Y{pe.park_y} F{pe.park_speed * 60}
        {% else %}
            { action_respond_info("CANCEL_PRINT: not homed / no QGL - T%d stays on the carriage" % t) }
        {% endif %}
    {% endif %}
    BED_MESH_CLEAR

########################################################################################

########################################################################################
# This override is taken directly from klicky macros
# You should use this override if using klicky
# Replace the homing override in yr klicky macros with this homing override
[homing_override]
axes: xyz
gcode:
    # collect user state variables
    _User_Variables
    {% set verbose = printer["gcode_macro _User_Variables"].verbose %}
    {% set safe_z = printer["gcode_macro _User_Variables"].safe_z|float %}
    {% set enable_z_hop = printer["gcode_macro _User_Variables"].enable_z_hop %}
    {% set kinematic_z = 0 %}
    {% set dock_on_zhome = printer["gcode_macro _User_Variables"].dock_on_zhome|default(True) %}
    {% set attachmove_y = printer["gcode_macro _User_Variables"].attachmove_y|default(0)|float %}
    {% set z_drop_feedrate = printer["gcode_macro _User_Variables"].z_drop_speed * 60 %}
    {% set travel_feedrate = printer["gcode_macro _User_Variables"].travel_speed * 60 %}
    {% set home_backoff_x = printer["gcode_macro _User_Variables"].home_backoff_x|default(0)|float %}
    {% set home_backoff_y = printer["gcode_macro _User_Variables"].home_backoff_y|default(0)|float %}
    {% set override_homing = printer["gcode_macro _User_Variables"].override_homing|default('') %}

    # checks if the variable definitions are up to date
    _klicky_check_variables_version

    _CheckProbe action=query

    # reset parameters
    {% set home_x, home_y, home_z, leave_probe_attached = False, False, False, False %}

    {% if 'PROBE_LOCK' in params %}
        {% if verbose %}
            { action_respond_info("PROBE_LOCK = True") }
        {% endif %}
        {% set leave_probe_attached = True %}
    {% endif %}

    # which axes have been requested for homing
    {% if not 'X' in params and not 'Y' in params and not 'Z' in params %}
        {% set home_x, home_y, home_z = True, True, True %}
        _KlickyDebug msg="homing_override going to home all axes"
    {% else %}
        {% if 'X' in params %}
            {% set home_x = True %}
            _KlickyDebug msg="homing_override going to home X"
        {% endif %}

        {% if 'Y' in params %}
            {% set home_y = True %}
            _KlickyDebug msg="homing_override going to home Y"
        {% endif %}

        {% if 'Z' in params %}
            {% set home_z = True %}
            _KlickyDebug msg="homing_override going to home Z"
        {% endif %}

        {% if 'X' in params and 'Y' in params and 'Z' in params %}
            # reset homing state variables if homing all axes
            _Homing_Variables reset=1
            _KlickyDebug msg="homing_override going to home all axes"
        {% endif %}
    {% endif %}

    ### BTC edits ############
    {% if printer["gcode_macro _BTC_VARIABLES"].use_dockslide %}
        {% if printer["gcode_macro _DOCKSLIDE_VARIABLES"].dockslide_status != 1 %}
            {% if printer["gcode_macro _DOCKSLIDE_VARIABLES"].dockslide_homed %}
                DOCKSLIDE_PARK
            {% else %}
                DOCKSLIDE_HOME
            {% endif %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_DOCKSLIDE_VARIABLES VARIABLE=doing_homing VALUE=True
    {% endif %}
    ### BTC edits ############

    _entry_point function=homing_override
    _KLICKY_STATUS_HOMING

    # if Z is not homed, do not move the bed if it goes down
    {% if 'z' not in printer.toolhead.homed_axes %}
        {% if enable_z_hop == False %} # Disables safe_z
            _KlickyDebug msg="homing_override z_hop disabled"
            {% set kinematic_z = safe_z %}
        {% endif %}
    {% endif %}

    # On the first G28 after motors losing power, moves Z to safe_z distance if z_hop is enabled
    {% if 'x' not in printer.toolhead.homed_axes and 'y' not in printer.toolhead.homed_axes and 'z' not in printer.toolhead.homed_axes %}
        {% if verbose %}
            { action_respond_info("No axis homed") }
        {% endif %}
        _KlickyDebug msg="homing_override no axis homed, setting position as X=Y=0 Z={kinematic_z}"
        SET_KINEMATIC_POSITION X=0 Y=0 Z={kinematic_z}
        M400
        _KlickyDebug msg="homing_override moving toolhead to {safe_z}mm from {printer.gcode_move.gcode_position.z}mm"
        {% if verbose %}
            { action_respond_info("moving to a safe Z distance") }
        {% endif %}
        G0 Z{safe_z} F{z_drop_feedrate}
    {% else %}
        _KlickyDebug msg="All axis homed"
        {% if printer.gcode_move.gcode_position.z > safe_z %}
            {% set safe_z = printer.gcode_move.gcode_position.z|float %}
            _KlickyDebug msg="Setting Safe_z to {printer.gcode_move.gcode_position.z}mm as Z is now above configured safe_z"
        {% endif %}
    {% endif %}

    {% if home_z %}
        {% if 'x' not in printer.toolhead.homed_axes and 'y' not in printer.toolhead.homed_axes %}
            {% if verbose %}
                { action_respond_info("X or Y not homed, forcing full G28") }
            {% endif %}
            {% set home_x, home_y, home_z = True, True, True %}
        {% endif %}
    {% endif %}

    # if dock is oriented on Y, do Y endstop first
    {% if ((attachmove_y == 0 and override_homing == '' ) or (override_homing == 'Y')) %}
        {% if home_y %}
            {% if override_homing == 'Y' %}
                _KlickyDebug msg="homing_override Y homing first override, due to override_homing = Y"
            {% else %}
                _KlickyDebug msg="homing_override Y homing first override, due to attachmove_y = 0"
            {% endif %}
            {% if verbose %}
                { action_respond_info("Homing Y") }
            {% endif %}
            {% if 'z' in printer.toolhead.homed_axes and printer.gcode_move.gcode_position.z < safe_z %}
                _KlickyDebug msg="homing_override moving toolhead to {safe_z}mm from {printer.gcode_move.gcode_position.z}mm in Y homing seq"
                G0 Z{safe_z} F{z_drop_feedrate}
            {% endif %}
            {% if printer["gcode_macro _HOME_Y"] is defined %}
                _KlickyDebug msg="homing_override calling _HOME_Y external script to handle Y homing"
                _HOME_Y
            {% else %}
                _KlickyDebug msg="homing_override Homing Y G28 Y0"
                G28 Y0
                {% if home_backoff_y != 0 %}
                    {% if (printer.configfile.settings.stepper_y.position_endstop > (printer.configfile.settings.stepper_y.position_min|default(0) + printer.configfile.settings.stepper_y.position_max)/2) %}
                        G0 Y{printer.configfile.settings.stepper_y.position_endstop - home_backoff_y} F{travel_feedrate}
                    {% else %}
                        G0 Y{printer.configfile.settings.stepper_y.position_endstop + home_backoff_y} F{travel_feedrate}
                    {% endif %}
                {% endif %}
            {% endif %}
        {% endif %}
        {% set home_y = False %}
    {% endif %}

    # Home X
    {% if home_x %}
        {% if verbose %}
            { action_respond_info("Homing X") }
        {% endif %}
        {% if 'z' in printer.toolhead.homed_axes and printer.gcode_move.gcode_position.z < safe_z %}
            _KlickyDebug msg="homing_override moving toolhead to {safe_z}mm from {printer.gcode_move.gcode_position.z}mm in X homing seq"
            G0 Z{safe_z} F{z_drop_feedrate}
        {% endif %}
        {% if printer["gcode_macro _HOME_X"] is defined %}
            _KlickyDebug msg="homing_override calling _HOME_X external script to handle X homing"
            _HOME_X
        {% else %}
            _KlickyDebug msg="homing_override Homing X, G28 X0"
            G28 X0
            {% if home_backoff_x != 0 %}
                {% if (printer.configfile.settings.stepper_x.position_endstop > (printer.configfile.settings.stepper_x.position_min|default(0) + printer.configfile.settings.stepper_x.position_max)/2) %}
                    G0 X{printer.configfile.settings.stepper_x.position_endstop - home_backoff_x} F{travel_feedrate}
                {% else %}
                    G0 X{printer.configfile.settings.stepper_x.position_endstop + home_backoff_x} F{travel_feedrate}
                {% endif %}
            {% endif %}
        {% endif %}
        G4 P500 # Pause for sensorless homing spin-down
    {% endif %}

    # Home Y
    {% if home_y %}
        {% if verbose %}
            { action_respond_info("Homing Y") }
        {% endif %}
        {% if 'z' in printer.toolhead.homed_axes and printer.gcode_move.gcode_position.z < safe_z %}
            _KlickyDebug msg="homing_override moving toolhead to {safe_z}mm from {printer.gcode_move.gcode_position.z}mm in Y homing seq"
            G0 Z{safe_z} F{z_drop_feedrate}
        {% endif %}
        {% if printer["gcode_macro _HOME_Y"] is defined %}
            _KlickyDebug msg="homing_override calling _HOME_Y external script to handle Y homing"
            _HOME_Y
        {% else %}
            _KlickyDebug msg="homing_override Homing Y, G28 Y0"
            G28 Y0
            {% if home_backoff_y != 0 %}
                {% if (printer.configfile.settings.stepper_y.position_endstop > (printer.configfile.settings.stepper_y.position_min|default(0) + printer.configfile.settings.stepper_y.position_max)/2) %}
                    G0 Y{printer.configfile.settings.stepper_y.position_endstop - home_backoff_y} F{travel_feedrate}
                {% else %}
                    G0 Y{printer.configfile.settings.stepper_y.position_endstop + home_backoff_y} F{travel_feedrate}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}

    # Home Z
    {% if home_z %}
        {% if verbose %}
            { action_respond_info("Homing Z") }
        {% endif %}
        {% if 'z' in printer.toolhead.homed_axes and printer.gcode_move.gcode_position.z < safe_z %}
            _KlickyDebug msg="homing_override moving toolhead to {safe_z}mm from {printer.gcode_move.gcode_position.z}mm in Z homing seq"
            G0 Z{safe_z} F{z_drop_feedrate}
        {% endif %}

        # Probe handling for Z homing (Directly attaches carriage-mounted Klicky without tool checks)
        {% if 'z_virtual_endstop' in printer['configfile'].config["stepper_z"]["endstop_pin"] %}
            _KlickyDebug msg="homing_override probe configured as virtual Z endstop, attaching probe"
            Attach_Probe
            {% if leave_probe_attached %}
                _Probe_Lock
            {% endif %}
        {% elif dock_on_zhome == True %}
            Dock_Probe
        {% endif %}

        _Home_Z_

        {% if 'z_virtual_endstop' in printer['configfile'].config["stepper_z"]["endstop_pin"] %}
            _KlickyDebug msg="homing_override probe no longer required, docking probe"
            Dock_Probe
        {% elif dock_on_zhome == False %}
            Dock_Probe
        {% endif %}
    {% endif %}

    _CheckProbe action=query
    _Park_Toolhead

    ### Reset Dockslide homing status flag ###
    {% if printer["gcode_macro _BTC_VARIABLES"].use_dockslide %}
        SET_GCODE_VARIABLE MACRO=_DOCKSLIDE_VARIABLES VARIABLE=doing_homing VALUE=False
    {% endif %}

    _exit_point function=homing_override
    _KLICKY_STATUS_READY

########################################################################################

########################################################################################
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
    ##### read E from pause macro #####
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    ##### set park positon for x and y #####
    # default is your max posion from your printer.cfg
    {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
    {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{E} F2100
    G1 Z{z_safe} F900
    G90
    G1 X20 Y220 F6000

###################################################################################

###################################################################################
#	Macro to execute when resuming printer
[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    ##### read E from pause macro #####
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    ##### end of definitions #####
    G91
    G1 E{E} F2100
    RESTORE_GCODE_STATE NAME=PAUSE_state
    BASE_RESUME