#####################################################################
# Tool offset calibration with tools_calibrate (klipper-toolchanger)
#
# The tools_calibrate Klipper module comes from the klipper-toolchanger
# repository by viesturz:
#   https://github.com/viesturz/klipper-toolchanger
#   Documentation: https://github.com/viesturz/klipper-toolchanger/blob/main/tools_calibrate.md
# Only tools_calibrate.py is used - no other module of that repository
# is needed. The macros in this file are an addition for BTC / Lineux
# Hotswap and are not part of the original repository.
#
# Install (link only this one module):
#   cd ~ && git clone https://github.com/viesturz/klipper-toolchanger.git
#   ln -sfn ~/klipper-toolchanger/klipper/extras/tools_calibrate.py ~/klipper/klippy/extras/
#
# Requires: ~/klipper/klippy/extras/tools_calibrate.py (symlink)
# Do NOT include together with btc_tubby.cfg / btc_tubby_z.cfg
# (they use the same sensor pin)
#
# Usage:
#   1. Enter the fixed sensor position below (sensor_x / sensor_y /
#      sensor_z). Take the values from the console line
#      "Sensor location at X,Y,Z" after a TOOL_LOCATE_SENSOR run.
#   2. G28 + QUAD_GANTRY_LEVEL, clean all nozzles
#   3. TOOLS_CALIBRATE_ALL (APPLY=0, default)
#      -> measures the reference tool (T0) first, then all other
#         enabled tools, and only prints the offsets for each tool.
#      TOOLS_CALIBRATE_ALL APPLY=1
#      -> additionally saves the offsets with TOOL_OFFSET_SET
#         (tool_offsets.cfg / save_variables). They survive a Klipper
#         restart and are used from the next pickup of each tool.
#      In Fluidd: open the arrow next to the TOOLS_CALIBRATE_ALL button
#      and set APPLY to 0 or 1.
#   4. Check the result with TOOL_OFFSETS_SHOW. Copying the values into
#      tool_N.cfg is only needed without tool_offsets.cfg.
#
# Single steps:
#   TOOLS_CALIBRATE_MOVE_TO_SENSOR  - move the current tool above the sensor
#                                     (first X/Y to sensor_x / safe_y, then
#                                      only in Y to the sensor)
#   TOOLS_CALIBRATE_LEAVE_SENSOR    - lift and move back in Y to safe_y
#   TOOL_LOCATE_SENSOR              - (module) locate sensor with T0
#   TOOL_CALIBRATE_TOOL_OFFSET      - (module) measure current tool vs T0
#   TOOL_CALIBRATE_QUERY_PROBE      - (module) show sensor state
#####################################################################

[tools_calibrate]
# Sensor (Tubby / Sexbolt) pin. PC15 = pin of the earlier _test_sexbolt test.
# NEVER use PG15 here: PG15 is the enable pin of stepper_z2 on the M8P!
# Check with TOOL_CALIBRATE_QUERY_PROBE: "open" when not pressed,
# "TRIGGERED" when pressed - otherwise add/remove the "!".
pin: ^PC15
travel_speed: 20
spread: 5
lower_z: 1.0
speed: 2
lift_speed: 4
final_lift_z: 4
sample_retract_dist: 2
samples: 3
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 2


[gcode_macro _TOOLS_CALIBRATE_VARIABLES]
# ============================ SETTINGS =============================
variable_sensor_x: 78.856250    # Fixed sensor position X (machine coordinates)
variable_sensor_y: -2.200000    # Fixed sensor position Y
variable_sensor_z: 3.873274     # Z where the nozzle triggers the sensor
variable_approach_z: 3.0        # Start height above sensor_z before probing
variable_safe_z: 10.0           # Travel height above sensor_z
variable_safe_y: 35.0           # Fallback if fixed_dock.cfg is not loaded.
                                # If _FIXED_DOCK_VARIABLES exists, its safe_y is used.
variable_travel_speed: 150      # mm/s for moves to the sensor
variable_z_speed: 15            # mm/s for Z moves
variable_temp: 150              # Nozzle temperature during calibration
variable_ref_tool: 0            # Reference tool (offsets 0, Cartographer touch)
gcode:
  # Placeholder, so Klipper accepts this section


[gcode_macro TOOLS_CALIBRATE_MOVE_TO_SENSOR]
description: Move the current tool above the fixed calibration sensor
gcode:
  {% set v = printer["gcode_macro _TOOLS_CALIBRATE_VARIABLES"] %}
  {% if v.sensor_x == 0 and v.sensor_y == 0 %}
    { action_raise_error("TOOLS_CALIBRATE: sensor_x / sensor_y not set in _TOOLS_CALIBRATE_VARIABLES!") }
  {% endif %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
    { action_raise_error("TOOLS_CALIBRATE: home X, Y and Z first!") }
  {% endif %}
  {% if "gcode_macro _FIXED_DOCK_VARIABLES" in printer %}
    {% set safe_y = printer["gcode_macro _FIXED_DOCK_VARIABLES"].safe_y %}
  {% else %}
    {% set safe_y = v.safe_y %}
  {% endif %}
  SAVE_GCODE_STATE NAME=_TOOLS_CAL_MOVE
  G90
  G1 Z{v.sensor_z + v.safe_z} F{v.z_speed * 60}
  G1 X{v.sensor_x} Y{safe_y} F{v.travel_speed * 60}   ; 1. X/Y in front of the sensor at safe_y
  G1 Y{v.sensor_y} F{v.travel_speed * 60}             ; 2. only Y towards the sensor
  G1 Z{v.sensor_z + v.approach_z} F{v.z_speed * 60}   ; 3. down to start height
  M400
  RESTORE_GCODE_STATE NAME=_TOOLS_CAL_MOVE


[gcode_macro TOOLS_CALIBRATE_LEAVE_SENSOR]
description: Lift above the sensor and move back in Y to safe_y
gcode:
  {% set v = printer["gcode_macro _TOOLS_CALIBRATE_VARIABLES"] %}
  {% if "gcode_macro _FIXED_DOCK_VARIABLES" in printer %}
    {% set safe_y = printer["gcode_macro _FIXED_DOCK_VARIABLES"].safe_y %}
  {% else %}
    {% set safe_y = v.safe_y %}
  {% endif %}
  SAVE_GCODE_STATE NAME=_TOOLS_CAL_LEAVE
  G90
  G1 Z{v.sensor_z + v.safe_z} F{v.z_speed * 60}       ; 1. lift
  G1 Y{safe_y} F{v.travel_speed * 60}                 ; 2. only Y back to safe_y
  M400
  RESTORE_GCODE_STATE NAME=_TOOLS_CAL_LEAVE


[gcode_macro TOOLS_CALIBRATE_ALL]
description: Measure XYZ offsets of all tools vs T0. APPLY=0 only shows the values, APPLY=1 also saves them (kept after restart)
gcode:
  {% set v = printer["gcode_macro _TOOLS_CALIBRATE_VARIABLES"] %}
  {% set apply = params.APPLY|default(0)|int %}
  {% if apply not in [0, 1] %}
    { action_raise_error("TOOLS_CALIBRATE: APPLY must be 0 (show only) or 1 (show and save)") }
  {% endif %}
  {% if apply == 1 and "gcode_macro TOOL_OFFSET_SET" not in printer %}
    { action_raise_error("TOOLS_CALIBRATE: APPLY=1 needs tool_offsets.cfg (TOOL_OFFSET_SET not found)") }
  {% endif %}
  { action_respond_info("TOOLS_CALIBRATE: APPLY=%d - %s" % (apply, "offsets will be saved" if apply == 1 else "offsets are only shown, nothing is saved")) }
  {% set numoftool = printer["gcode_macro _BTC_VARIABLES"].numoftool %}
  {% set ref = v.ref_tool %}

  {% if ref not in numoftool %}
    { action_raise_error("TOOLS_CALIBRATE: reference tool T%d is not enabled in BTC!" % ref) }
  {% endif %}
  {% if printer.quad_gantry_level is defined and not printer.quad_gantry_level.applied %}
    { action_raise_error("TOOLS_CALIBRATE: run G28 and QUAD_GANTRY_LEVEL first!") }
  {% endif %}

  # Reference tool first, then all other tools
  {% set order = [ref] + (numoftool|reject("equalto", ref)|list) %}
  { action_respond_info("TOOLS_CALIBRATE: order %s" % order) }

  # Preheat all tools
  {% for t in order %}
    M104 T{t} S{v.temp}
  {% endfor %}

  {% for t in order %}
    T{t}
    TOOLS_CALIBRATE_MOVE_TO_SENSOR
    M109 T{t} S{v.temp}
    {% if t == ref %}
      TOOL_LOCATE_SENSOR
    {% else %}
      TOOL_CALIBRATE_TOOL_OFFSET
      _TOOLS_CALIBRATE_REPORT TOOL={t} APPLY={apply}
    {% endif %}
    TOOLS_CALIBRATE_LEAVE_SENSOR
    M104 T{t} S0
  {% endfor %}

  {% if apply == 1 %}
    { action_respond_info("TOOLS_CALIBRATE: done. Offsets are saved - check them with TOOL_OFFSETS_SHOW.") }
  {% else %}
    { action_respond_info("TOOLS_CALIBRATE: done. Nothing saved - run again with APPLY=1 to save the offsets.") }
  {% endif %}


[gcode_macro _TOOLS_CALIBRATE_REPORT]
description: Print the last measured tool offset, APPLY=1 also saves it
gcode:
  {% set t = params.TOOL|int %}
  {% set apply = params.APPLY|default(0)|int %}
  {% set r = printer.tools_calibrate.last_result %}
  { action_respond_info(
      "TOOLS_CALIBRATE T%d:\n"
      "variable_xoffset: %.3f\n"
      "variable_yoffset: %.3f\n"
      "variable_zoffset: %.3f" % (t, r[0], r[1], r[2])) }
  {% if apply == 1 %}
    # Saves to tool_offsets_saved.cfg and updates _VARIABLES_T{t}
    TOOL_OFFSET_SET TOOL={t} X={r[0]|round(3)} Y={r[1]|round(3)} Z={r[2]|round(3)}
  {% endif %}
